<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Caja · UniPuntos</title>
  <meta name="theme-color" content="#1d5c47">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="estilos.css">
</head>
<body data-pagina="caja">
<main>
  <div class="encabezado fila-entre">
    <div>
      <small>Caja</small>
      <h1 id="nombre-comercio">…</h1>
    </div>
    <select id="comercio" class="selector" aria-label="Cambiar de comercio (demo)"></select>
  </div>

  <div class="dos-columnas">
    <div>
      <section class="tarjeta">
        <label class="etiqueta" for="codigo">Código del estudiante</label>
        <input id="codigo" class="campo-codigo" maxlength="8" autocomplete="off" autocapitalize="characters"
               spellcheck="false" placeholder="ABCD2345" inputmode="text">
        <div class="rejilla" style="grid-template-columns:1fr auto;margin-top:12px">
          <button class="boton" id="buscar">Buscar código</button>
          <!-- Escaneo con cámara solo si el navegador soporta BarcodeDetector (p. ej. Chrome en Android). -->
          <button class="boton fantasma oculto" id="escanear" aria-label="Escanear QR">📷</button>
        </div>
        <video id="video" class="oculto" playsinline muted></video>
      </section>

      <section class="tarjeta oculto" id="detalle" style="margin-top:12px">
        <div class="fila" style="align-items:flex-start">
          <span class="icono" id="detalle-icono"></span>
          <div style="flex:1">
            <h2 id="detalle-nombre"></h2>
            <div class="fila" style="margin-top:6px;flex-wrap:wrap;gap:6px">
              <span class="insignia marca num" id="detalle-puntos"></span>
              <span class="insignia" id="detalle-estado"></span>
            </div>
          </div>
        </div>
        <p class="suave" style="font-size:.85rem;margin:14px 0">🕶️ La identidad del estudiante no se muestra en caja.</p>
        <button class="boton ancho" id="confirmar">Confirmar canje</button>
      </section>
    </div>

    <section class="seccion" style="margin-top:0">
      <div class="tarjeta">
        <div class="fila-entre" style="margin-bottom:4px">
          <h2>Canjes registrados</h2>
          <span class="insignia num" id="total"></span>
        </div>
        <p class="suave" style="font-size:.82rem;margin:0 0 14px">Base para la liquidación mensual con la universidad.</p>
        <ul class="lista" id="canjes"></ul>
      </div>
    </section>
  </div>
</main>

<script src="app.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let datos, codigoActual = null;
  const ESTADOS = {
    pendiente: ['Listo para canjear', 'ok'],
    usado: ['Ya fue usado', 'error'],
    vencido: ['Vencido', 'error'],
    procesando: ['Verificando en la cadena…', ''],
  };

  async function iniciar() {
    datos = await UP.api('/api/datos');
    const recordado = (() => { try { return localStorage.getItem('up-comercio'); } catch { return null; } })();
    $('comercio').innerHTML = datos.comercios
      .map((c) => `<option value="${c.id}" ${c.id === recordado ? 'selected' : ''}>${UP.esc(c.nombre)}</option>`).join('');
    $('comercio').addEventListener('change', () => {
      try { localStorage.setItem('up-comercio', $('comercio').value); } catch {}
      limpiar();
      cargarCanjes();
    });
    $('buscar').addEventListener('click', () => buscar($('codigo').value));
    $('codigo').addEventListener('keydown', (e) => { if (e.key === 'Enter') buscar($('codigo').value); });
    // Busca solo en cuanto se completan los 8 caracteres.
    $('codigo').addEventListener('input', () => { if ($('codigo').value.trim().length === 8) buscar($('codigo').value); });
    $('confirmar').addEventListener('click', confirmar);
    if ('BarcodeDetector' in window) {
      $('escanear').classList.remove('oculto');
      $('escanear').addEventListener('click', escanear);
    }
    limpiar();
    cargarCanjes();
  }

  const nombreComercio = () => datos.comercios.find((c) => c.id === $('comercio').value).nombre;

  function limpiar() {
    codigoActual = null;
    $('nombre-comercio').textContent = nombreComercio();
    $('detalle').classList.add('oculto');
  }

  async function buscar(codigo) {
    codigo = codigo.trim().toUpperCase();
    if (!codigo) return;
    $('buscar').disabled = true;
    try {
      const c = await UP.api('/api/codigos/' + encodeURIComponent(codigo));
      const deEsteComercio = c.recompensa.comercio === $('comercio').value;
      const [texto, tipo] = deEsteComercio ? ESTADOS[c.estado] : ['De otro comercio', 'error'];
      $('detalle-icono').textContent = UP.emoji(c.recompensa.id);
      $('detalle-nombre').textContent = c.recompensa.nombre;
      $('detalle-puntos').textContent = `${c.recompensa.puntos} pts`;
      $('detalle-estado').textContent = texto;
      $('detalle-estado').className = `insignia ${tipo}`;
      $('confirmar').disabled = c.estado !== 'pendiente' || !deEsteComercio;
      $('detalle').classList.remove('oculto');
      codigoActual = codigo;
    } catch (error) {
      $('detalle').classList.add('oculto');
      UP.aviso(UP.esc(error.message), 'error');
    } finally {
      $('buscar').disabled = false;
    }
  }

  async function confirmar() {
    const boton = $('confirmar');
    boton.disabled = true;
    boton.innerHTML = '<span class="girando"></span> Registrando en la cadena…';
    try {
      const r = await UP.api(`/api/codigos/${codigoActual}/confirmar`, {
        method: 'POST',
        body: { comercio: $('comercio').value },
      });
      if (r.verificando) {
        // La red no confirmó a tiempo: el código queda bloqueado mientras se verifica.
        $('detalle-estado').textContent = ESTADOS.procesando[0];
        $('detalle-estado').className = 'insignia';
        UP.aviso(`${UP.esc(r.mensaje)} <a href="${r.explorador}" target="_blank" rel="noopener">Ver transacción</a>`, '', 8);
        return;
      }
      $('detalle').classList.add('oculto');
      $('codigo').value = '';
      UP.aviso(`✓ ${UP.esc(r.recompensa.nombre)} canjeado. <a href="${r.explorador}" target="_blank" rel="noopener">Ver transacción</a>`, 'ok', 6);
      cargarCanjes();
    } catch (error) {
      boton.disabled = false;
      UP.aviso(UP.esc(error.message), 'error');
    } finally {
      boton.textContent = 'Confirmar canje';
    }
  }

  async function cargarCanjes() {
    $('canjes').innerHTML = '<li><div class="esqueleto" style="height:40px;flex:1"></div></li>';
    try {
      const { canjes } = await UP.api(`/api/comercios/${$('comercio').value}/canjes`);
      const total = canjes.reduce((s, c) => s + c.cantidad, 0);
      $('total').textContent = `${canjes.length} · ${UP.numero(total)} pts`;
      const nombre = (id) => datos.catalogo.find((r) => r.id === id)?.nombre ?? id;
      $('canjes').innerHTML = canjes.length
        ? canjes.slice().reverse().map((c) => `
            <li>
              <span class="icono">${UP.emoji(c.recompensa)}</span>
              <div class="texto">
                <strong>${UP.esc(nombre(c.recompensa))}</strong>
                <small>${UP.fecha(c.fecha)} · <a href="${c.explorador}" target="_blank" rel="noopener">ver ↗</a></small>
              </div>
              <span class="cantidad">${c.cantidad} pts</span>
            </li>`).join('')
        : '<li class="vacio" style="display:block"><span class="icono">🧾</span>Sin canjes todavía.</li>';
    } catch (error) {
      $('canjes').innerHTML = `<li class="vacio" style="display:block">${UP.esc(error.message)}</li>`;
    }
  }

  // Escaneo del QR con la cámara (si el navegador lo permite).
  async function escanear() {
    const video = $('video');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;
      video.classList.remove('oculto');
      await video.play();
      const detector = new BarcodeDetector({ formats: ['qr_code'] });
      const detener = () => { stream.getTracks().forEach((t) => t.stop()); video.classList.add('oculto'); };
      const buscarCuadro = async () => {
        const [hallado] = await detector.detect(video);
        if (hallado) {
          detener();
          $('codigo').value = hallado.rawValue;
          buscar(hallado.rawValue);
        } else {
          requestAnimationFrame(buscarCuadro);
        }
      };
      buscarCuadro();
    } catch (error) {
      UP.aviso('No se pudo abrir la cámara: ' + UP.esc(error.message), 'error');
    }
  }

  iniciar().catch((e) => UP.aviso(UP.esc(e.message), 'error'));
</script>
</body>
</html>
