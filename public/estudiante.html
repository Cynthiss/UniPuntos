<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mis puntos · UniPuntos</title>
  <meta name="theme-color" content="#1d5c47">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="estilos.css">
</head>
<body data-pagina="estudiante">
<main>
  <div class="encabezado fila-entre">
    <div>
      <small>Hola,</small>
      <h1 id="saludo">…</h1>
    </div>
    <!-- DEMO: en producción el estudiante entra con su cuenta universitaria. -->
    <select id="estudiante" class="selector" aria-label="Cambiar de estudiante (demo)"></select>
  </div>

  <div class="dos-columnas">
    <div>
      <section class="saldo">
        <span class="etiqueta">Saldo disponible</span>
        <div class="monto num" id="saldo">—<span>pts</span></div>
        <a id="wallet" target="_blank" rel="noopener"></a>
        <div class="pie">
          <span class="insignia">🔒&nbsp; No transferibles</span>
          <span class="insignia">✋&nbsp; Solo tú los gastas</span>
        </div>
      </section>

      <section class="seccion">
        <div class="fila-entre" style="margin-bottom:12px">
          <h2>Recompensas</h2>
          <small id="disponibles"></small>
        </div>
        <div class="rejilla rejilla-2" id="catalogo"></div>
      </section>
    </div>

    <section class="seccion" style="margin-top:28px">
      <h2 style="margin-bottom:12px">Movimientos</h2>
      <div class="tarjeta"><ul class="lista" id="historial"></ul></div>
    </section>
  </div>
</main>

<!-- Hoja con el código QR de un solo uso -->
<div class="fondo-modal oculto" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
  <div class="hoja">
    <div class="asa"></div>
    <div id="modal-espera">
      <small>Muestra este código en caja</small>
      <h2 id="modal-titulo" style="margin-top:4px"></h2>
      <div class="qr"><img id="qr-img" alt="Código QR del canje"></div>
      <div class="codigo-grande" id="qr-codigo"></div>
      <small id="qr-puntos"></small><br>
      <span class="estado-espera"><span class="pulso"></span><span id="qr-estado">Esperando a la caja · vence en 10:00</span></span>
      <button class="boton secundario ancho" id="cancelar">Cerrar</button>
    </div>
    <div id="modal-listo" class="oculto">
      <div class="exito">✓</div>
      <h2>¡Canje confirmado!</h2>
      <p class="suave" id="listo-detalle"></p>
      <button class="boton ancho" id="listo">Listo</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let datos, saldo = 0, espera = null;

  async function iniciar() {
    datos = await UP.api('/api/datos');
    const recordado = (() => { try { return localStorage.getItem('up-estudiante'); } catch { return null; } })();
    $('estudiante').innerHTML = datos.estudiantes
      .map((e) => `<option value="${e.id}" ${e.id === recordado ? 'selected' : ''}>${UP.esc(e.nombre)}</option>`).join('');
    $('estudiante').addEventListener('change', () => {
      try { localStorage.setItem('up-estudiante', $('estudiante').value); } catch {}
      cargar();
    });
    $('cancelar').addEventListener('click', cerrarModal);
    $('listo').addEventListener('click', cerrarModal);
    $('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') cerrarModal(); });
    await cargar();
  }

  const nombreEstudiante = () => datos.estudiantes.find((e) => e.id === $('estudiante').value).nombre;
  const nombreComercio = (id) => datos.comercios.find((c) => c.id === id)?.nombre ?? id;
  const recompensa = (id) => datos.catalogo.find((r) => r.id === id);

  function esqueletos() {
    $('saldo').innerHTML = '<span class="esqueleto" style="display:inline-block;width:120px;height:44px"></span>';
    $('catalogo').innerHTML = Array(4).fill('<div class="tarjeta"><div class="esqueleto" style="height:96px"></div></div>').join('');
    $('historial').innerHTML = '<li><div class="esqueleto" style="height:40px;flex:1"></div></li>';
  }

  async function cargar() {
    $('saludo').textContent = nombreEstudiante().split(' ')[0];
    esqueletos();
    try {
      const info = await UP.api('/api/estudiantes/' + $('estudiante').value);
      saldo = info.saldo;
      $('saldo').innerHTML = `${UP.numero(info.saldo)}<span>pts</span>`;
      $('wallet').href = info.explorador;
      $('wallet').textContent = `Wallet ${UP.corta(info.wallet)} · ver en la cadena ↗`;
      pintarCatalogo();
      pintarHistorial(info.historial);
    } catch (error) {
      $('saldo').innerHTML = '—<span>pts</span>';
      UP.aviso(UP.esc(error.message), 'error');
    }
  }

  function pintarCatalogo() {
    const alcanzables = datos.catalogo.filter((r) => saldo >= r.puntos).length;
    $('disponibles').textContent = `${alcanzables} de ${datos.catalogo.length} disponibles`;
    $('catalogo').innerHTML = datos.catalogo.map((r) => {
      const alcanza = saldo >= r.puntos;
      const progreso = Math.min(100, Math.round((saldo / r.puntos) * 100));
      return `
        <article class="tarjeta recompensa">
          <div class="cuerpo">
            <span class="icono">${UP.emoji(r.id)}</span>
            <div><h3>${UP.esc(r.nombre)}</h3><small>${UP.esc(nombreComercio(r.comercio))}</small></div>
          </div>
          ${alcanza ? '' : `<div><div class="barra-progreso"><div style="width:${progreso}%"></div></div>
            <div class="falta" style="margin-top:6px">Te faltan ${r.puntos - saldo} pts</div></div>`}
          <div class="pie">
            <span class="precio num">${r.puntos} <small>pts</small></span>
            <button class="boton chico" data-id="${r.id}" ${alcanza ? '' : 'disabled'}>Canjear</button>
          </div>
        </article>`;
    }).join('');
    $('catalogo').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => pedirCodigo(b)));
  }

  function pintarHistorial(historial) {
    if (!historial.length) {
      $('historial').innerHTML = '<li class="vacio" style="display:block"><span class="icono">🌱</span>Aún no hay movimientos.<br><small>Gana puntos pagando a tiempo o participando.</small></li>';
      return;
    }
    $('historial').innerHTML = historial.map((h) => {
      const gana = h.tipo === 'award';
      const titulo = gana ? 'Puntos recibidos' : (recompensa(h.recompensa)?.nombre ?? h.recompensa);
      return `
        <li>
          <span class="icono ${gana ? 'ok' : ''}">${gana ? '＋' : UP.emoji(h.recompensa)}</span>
          <div class="texto">
            <strong>${UP.esc(titulo)}</strong>
            <small>${UP.fecha(h.fecha)} · <a href="${h.explorador}" target="_blank" rel="noopener">ver ↗</a></small>
          </div>
          <span class="cantidad ${gana ? 'mas' : 'menos'}">${gana ? '+' : '−'}${h.cantidad}</span>
        </li>`;
    }).join('');
  }

  async function pedirCodigo(boton) {
    const original = boton.innerHTML;
    boton.disabled = true;
    boton.innerHTML = '<span class="girando"></span>';
    try {
      const r = await UP.api('/api/codigos', {
        method: 'POST',
        body: { estudiante: $('estudiante').value, recompensa: boton.dataset.id },
      });
      abrirModal(r);
    } catch (error) {
      UP.aviso(UP.esc(error.message), 'error');
    } finally {
      boton.disabled = false;
      boton.innerHTML = original;
    }
  }

  // Muestra el QR y consulta cada 3 s si la caja ya confirmó el canje.
  function abrirModal({ codigo, qr, expira, recompensa: r }) {
    $('modal-titulo').textContent = r.nombre;
    $('qr-img').src = qr;
    $('qr-codigo').textContent = codigo;
    $('qr-puntos').textContent = `${r.puntos} pts · ${nombreComercio(r.comercio)}`;
    $('modal-espera').classList.remove('oculto');
    $('modal-listo').classList.add('oculto');
    $('modal').classList.remove('oculto');

    const vence = new Date(expira).getTime();
    let consultas = 0;
    let registrando = false; // la caja ya confirmó y falta el registro en la cadena
    espera = setInterval(async () => {
      if (!registrando) {
        const restante = Math.max(0, vence - Date.now());
        const mm = String(Math.floor(restante / 60000)).padStart(2, '0');
        const ss = String(Math.floor((restante % 60000) / 1000)).padStart(2, '0');
        $('qr-estado').textContent = restante ? `Esperando a la caja · vence en ${mm}:${ss}` : 'El código venció';
      }

      if (++consultas % 3 !== 0) return; // cada 3 segundos
      try {
        const c = await UP.api('/api/codigos/' + codigo);
        if (c.estado === 'usado') {
          detenerEspera();
          $('listo-detalle').textContent = `Canjeaste ${r.nombre} por ${r.puntos} pts. Los puntos se quemaron en la cadena.`;
          $('modal-espera').classList.add('oculto');
          $('modal-listo').classList.remove('oculto');
        } else if (c.estado === 'procesando') {
          // La caja ya confirmó: falta que la transacción quede registrada.
          registrando = true;
          $('qr-estado').textContent = 'La caja confirmó · registrando en la cadena…';
        } else if (c.estado === 'vencido') {
          detenerEspera();
        }
      } catch { /* se reintenta en la siguiente vuelta */ }
    }, 1000);
  }

  function detenerEspera() { clearInterval(espera); espera = null; }

  function cerrarModal() {
    detenerEspera();
    $('modal').classList.add('oculto');
    cargar();
  }

  iniciar().catch((e) => UP.aviso(UP.esc(e.message), 'error'));
</script>
</body>
</html>
